name: Pubblicazione giornaliera Instagram

on:
  schedule:
    # Esegue il workflow due volte al giorno:
    # 06:00 UTC -> 07:00/08:00 ora italiana
    # 15:17 UTC -> 16:17/17:17 ora italiana
    - cron: "17 6,15 * * *"
  workflow_dispatch: {}  # permette di lanciarlo manualmente da GitHub per fare test

permissions:
  contents: write  # necessario per aggiornare history.json e caricare le immagini

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Esegui lo script di pubblicazione
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_IMAGES_BRANCH: ${{ github.ref_name }}
        run: python main.py

      - name: Salva lo storico dei post generati
        run: |
         git config --local user.email "github-actions[bot]@users.noreply.github.com"
         git config --local user.name "github-actions[bot]"
         git add published/*.json
         git commit -m "Auto-update published text history [skip ci]" || exit 0
         git push
